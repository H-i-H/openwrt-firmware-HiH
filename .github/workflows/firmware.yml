name: 固件构建

on:
  push:
    branches: [ main ]
    paths: [ 'firmware/**' ]
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      device:
        description: '只编指定设备（留空=全部）'
        required: false
        default: ''

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  OPENWRT_COMMIT: fb742de8e5126809fddf16fa2b5e82b016be0edb

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.scan.outputs.devices }}
      build_devices: ${{ steps.scan.outputs.build_devices }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          ALL=$(ls firmware/*/config 2>/dev/null | sed 's|^firmware/||; s|/config$||' | jq -R -s -c 'split("\n")|map(select(length>0))')
          SEL='${{ github.event.inputs.device }}'
          if [ -n "$SEL" ]; then
            BUILD=$(echo "$ALL" | jq -c --arg d "$SEL" 'map(select(.==$d))')
            if [ "$BUILD" = "[]" ]; then echo "设备不存在: $SEL"; exit 1; fi
          else
            BUILD="$ALL"
          fi
          echo "devices=$ALL" >> "$GITHUB_OUTPUT"
          echo "build_devices=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.plan.outputs.build_devices) }}
    steps:
      - uses: actions/checkout@v4

      - name: 大盘搬家
        run: sudo mkdir -p /mnt/owrt && sudo chown "$USER" /mnt/owrt

      - name: 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd jq python3-pyelftools cmake libelf-dev

      - name: 恢复下载缓存
        uses: actions/cache/restore@v4
        with:
          path: /mnt/owrt/dl
          key: fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-
            fw-dl-${{ matrix.device }}-

      - name: 取 OpenWrt 源码
        run: |
          git init /mnt/owrt
          git -C /mnt/owrt remote add origin https://github.com/openwrt/openwrt.git
          for i in 1 2 3; do if git -C /mnt/owrt fetch --depth 1 origin $OPENWRT_COMMIT; then break; fi; sleep 15; done
          git -C /mnt/owrt checkout FETCH_HEAD

      - name: 配 feed + 定制 + 基因
        run: |
          cd /mnt/owrt
          cp "$GITHUB_WORKSPACE/firmware/feeds.conf.default" feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/prepare.sh"
          cp "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/config" .config
          if [ -d "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/files" ]; then
            cp -r "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/files/." files/
          fi
          grep -q 'GO_DEFAULT_VERSION:=1.27' feeds/packages/lang/golang/golang-values.mk || sed -i 's/GO_DEFAULT_VERSION:=1.26/GO_DEFAULT_VERSION:=1.27/' feeds/packages/lang/golang/golang-values.mk
          make defconfig
          make download -j"$(nproc)" V=s

      - name: rustup 三件套
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          source "$HOME/.cargo/env"
          cd /mnt/owrt
          STABLE=$(grep -oP '^channel\s*=\s*"\K[^"]+' feeds/HiH/honk/src/rust-toolchain.toml 2>/dev/null || echo stable)
          NIGHTLY=$(grep -oP '^channel\s*=\s*"\K[^"]+' feeds/HiH/honk/src/crates/honk-ebpf/rust-toolchain.toml)
          if grep -q '^CONFIG_x86_64=y' .config; then
            RUST_TARGET=x86_64-unknown-linux-musl
          else
            RUST_TARGET=aarch64-unknown-linux-musl
          fi
          rustup toolchain install "$STABLE" --profile minimal --target "$RUST_TARGET"
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src --component llvm-tools
          curl -fsSL --retry 3 -o /tmp/bpf.tar.zst "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          zstd -dc /tmp/bpf.tar.zst | tar -xf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 编译
        run: |
          cd /mnt/owrt
          export PATH="$HOME/.cargo/bin:$PATH"
          make -j"$(nproc)" || make -j1 V=s

      - name: 收集产物（带设备短名）
        run: |
          mkdir -p out
          find /mnt/owrt/bin/targets -name '*.img.gz' -exec cp -t out/ {} +
          find /mnt/owrt/bin/targets -name '*.manifest' -exec cp -t out/ {} +
          cd out
          for f in *; do mv "$f" "HiH-${{ matrix.device }}-$f"; done
          ls HiH-${{ matrix.device }}-* | grep -v sha256sums | xargs sha256sum > HiH-${{ matrix.device }}-sha256sums

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.device }}
          path: out/

      - name: 保存下载缓存（失败也存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/owrt/dl
          key: fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-${{ github.run_id }}

  release:
    needs: [plan, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: 发布（按设备追加，全部到齐转正式，留 3 个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(TZ=UTC-8 date +%Y.%m.%d)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "固件 $TAG" --notes "自动构建 · OpenWrt 源码版本 ${OPENWRT_COMMIT}"
          fi
          for d in $(jq -r '.[]' <<< '${{ needs.plan.outputs.build_devices }}'); do
            if ls dist/HiH-$d-*sysupgrade*.img.gz >/dev/null 2>&1; then
              gh release upload "$TAG" dist/HiH-$d-* --clobber
            else
              echo "缺镜像: $d，本轮跳过"
            fi
          done
          gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets[].name' > /tmp/assets.txt
          MISSING=0
          for d in $(jq -r '.[]' <<< '${{ needs.plan.outputs.devices }}'); do
            if [ "$(grep -c "HiH-$d-.*sysupgrade" /tmp/assets.txt)" -gt 0 ]; then
              echo "已到齐: $d"
            else
              echo "未到齐: $d"; MISSING=1
            fi
          done
          if [ "$MISSING" = 0 ]; then
            gh release edit "$TAG" --prerelease=false --latest
            echo 全部到齐，已转正式版
          else
            echo 部分设备未出货，保持 beta
          fi
          gh api "repos/${GH_REPO}/releases" --jq '.[].tag_name' | tail -n +4 | while read -r t; do gh release delete "$t" -y --cleanup-tag || true; done
