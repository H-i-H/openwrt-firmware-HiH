name: 固件构建

on:
  push:
    branches: [ main ]
    paths: [ 'firmware/**' ]          # 只有变更才触发
  schedule:
    - cron: '0 18 1 * *'              # 每月 1 日（北京时间凌晨 2 点）
  workflow_dispatch: {}               # 手动触发

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true            # 新推送自动停止旧任务

permissions:
  contents: write                     # 发布 Release 用

env:
  OPENWRT_COMMIT: fb742de8e5126809fddf16fa2b5e82b016be0edb   # 基座钉死

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.scan.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          DEVS=$(ls firmware/*/config 2>/dev/null | sed 's|^firmware/||; s|/config$||' | jq -R -s -c 'split("\n")|map(select(length>0))')
          echo "devices=$DEVS" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.plan.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4

      - name: 拷贝
        run: sudo mkdir -p /mnt/owrt && sudo chown "$USER" /mnt/owrt

      - name: 装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd jq python3-pyelftools cmake libelf-dev

      - name: 恢复下载缓存
        uses: actions/cache/restore@v4
        with:
          path: /mnt/owrt/dl
          key: fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-
            fw-dl-${{ matrix.device }}-

      - name: 取基座源码
        run: |
          git init /mnt/owrt
          git -C /mnt/owrt remote add origin https://github.com/openwrt/openwrt.git
          for i in 1 2 3; do if git -C /mnt/owrt fetch --depth 1 origin $OPENWRT_COMMIT; then break; fi; sleep 15; done
          git -C /mnt/owrt checkout FETCH_HEAD

      - name: 配 feed + 定制
        run: |
          cd /mnt/owrt
          cp "$GITHUB_WORKSPACE/firmware/feeds.conf.default" feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/prepare.sh"
          cp "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/config" .config
          [ -d "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/files" ] && \
            cp -r "$GITHUB_WORKSPACE/firmware/${{ matrix.device }}/files/." files/ || true
          # Go 保险：xray/sing-box 门槛（NOTES 1.1）
          grep -q 'GO_DEFAULT_VERSION:=1.27' feeds/packages/lang/golang/golang-values.mk || \
            sed -i 's/GO_DEFAULT_VERSION:=1.26/GO_DEFAULT_VERSION:=1.27/' feeds/packages/lang/golang/golang-values.mk
          make defconfig
          make download -j"$(nproc)" V=s

      - name: rustup 三件套（honk/eBPF，NOTES 9.1/9.9）
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          source "$HOME/.cargo/env"
          cd /mnt/owrt
          STABLE=$(grep -oP '^channel\s*=\s*"\K[^"]+' feeds/HiH/honk/src/rust-toolchain.toml 2>/dev/null || echo stable)
          NIGHTLY=$(grep -oP '^channel\s*=\s*"\K[^"]+' feeds/HiH/honk/src/crates/honk-ebpf/rust-toolchain.toml)
          case "$(grep -E '^CONFIG_(aarch64|x86_64)=y' .config | head -1)" in
            *x86_64*)  RUST_TARGET=x86_64-unknown-linux-musl ;;
            *)         RUST_TARGET=aarch64-unknown-linux-musl ;;
          esac
          rustup toolchain install "$STABLE" --profile minimal --target "$RUST_TARGET"
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src --component llvm-tools
          curl -fsSL --retry 3 -o /tmp/bpf.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          zstd -dc /tmp/bpf.tar.zst | tar -xf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 编译
        run: |
          cd /mnt/owrt
          export PATH="$HOME/.cargo/bin:$PATH"
          make -j"$(nproc)" || make -j1 V=s

      - name: 收集产物
        run: |
          mkdir -p out
          find /mnt/owrt/bin/targets -name '*.img.gz' -exec cp -t out/ {} +
          find /mnt/owrt/bin/targets -name '*.manifest' -exec cp -t out/ {} +
          (cd out && sha256sum * > sha256sums)

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.device }}
          path: out/

      - name: 保存下载缓存（失败也存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/owrt/dl
          key: fw-dl-${{ matrix.device }}-${{ env.OPENWRT_COMMIT }}-${{ github.run_id }}

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 发布 beta
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="fw-$(TZ=UTC-8 date +%Y.%m.%d)"
          gh release view "$TAG" >/dev/null 2>&1 && TAG="$TAG-$(TZ=UTC-8 date +%H%M%S)"
          gh release create "$TAG" $(find dist -type f) \
            --prerelease --title "固件 $TAG" \
            --notes "CI 自动构建（beta）· 基座 ${OPENWRT_COMMIT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: 测试检查（合格转正式版）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          for d in $(jq -r '.[]' <<< '${{ needs.plan.outputs.devices }}'); do
            ls dist/fw-$d/*sysupgrade*.img.gz || { echo "缺镜像 $d，保持 beta"; exit 1; }
            [ -s dist/fw-$d/sha256sums ] || { echo "缺校验和 $d，保持 beta"; exit 1; }
          done
          gh release edit "$TAG" --prerelease=false --latest
          echo "测试通过，已转正式版"
